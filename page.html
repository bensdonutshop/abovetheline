<title>Above The Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Narrow:wght@500;600;700&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=DM+Mono:wght@400;500&display=swap">

<style>
/* ============================================================ tokens */
:root{
  --paper:#F1EFEA; --surface:#FFFFFF; --sunk:#E7E3DB;
  --ink:#16130F; --ink-2:#57514A; --ink-3:#8C857B;
  --rule:#D9D3C9; --rule-soft:#E6E1D8;
  --flare:#FF4D0F; --flare-ink:#FFFFFF; --flare-wash:rgba(255,77,15,.10);
  --shadow:0 1px 2px rgba(22,19,15,.05), 0 8px 24px -14px rgba(22,19,15,.22);

  --display:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --narrow:"Archivo Narrow","Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --gutter:20px; --rail-l:288px; --rail-r:334px; --max:1560px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#100E0C; --surface:#1A1714; --sunk:#221E1A;
  --ink:#F2EEE8; --ink-2:#A79F96; --ink-3:#7B736A;
  --rule:#2E2925; --rule-soft:#241F1B;
  --flare:#FF6B33; --flare-ink:#1A0B03; --flare-wash:rgba(255,107,51,.13);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#100E0C; --surface:#1A1714; --sunk:#221E1A;
  --ink:#F2EEE8; --ink-2:#A79F96; --ink-3:#7B736A;
  --rule:#2E2925; --rule-soft:#241F1B;
  --flare:#FF6B33; --flare-ink:#1A0B03; --flare-wash:rgba(255,107,51,.13);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
a{color:inherit; text-decoration:none}
img{display:block; max-width:100%}
:focus-visible{outline:2px solid var(--flare); outline-offset:3px; border-radius:2px}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}

/* ============================================================ masthead */
.mast{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:50;
  background:var(--paper); border-bottom:1px solid var(--rule);
}
.mast-in{
  max-width:var(--max); margin:0 auto; padding:0 var(--gutter);
  display:flex; align-items:center; gap:18px; min-height:64px; flex-wrap:wrap;
}
.wordmark{display:flex; align-items:baseline; gap:9px; margin-right:auto; padding:14px 0 12px}
.wordmark b{
  font-family:var(--display); font-weight:800; font-stretch:82%;
  font-size:26px; letter-spacing:-.022em; line-height:1; text-transform:uppercase;
}
.wordmark .rule-dash{width:26px; height:4px; background:var(--flare); border-radius:1px; transform:translateY(-4px)}
.wordmark i{
  font-family:var(--mono); font-style:normal; font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); padding-bottom:1px;
}

.tabs{display:flex; gap:2px; padding:4px; background:var(--sunk); border-radius:999px; position:relative}
/* A single pill that slides between tabs, rather than each tab lighting up. */
.glider{position:absolute; top:4px; bottom:4px; left:0; width:0; border-radius:999px;
  background:var(--ink); z-index:0; opacity:0;
  transition:transform .34s cubic-bezier(.4,0,.2,1), width .34s cubic-bezier(.4,0,.2,1), opacity .2s}
.glider[data-ready="1"]{opacity:1}
.views .glider{background:var(--flare)}
.tab{
  font-family:var(--display); font-weight:700; font-stretch:88%; font-size:12.5px;
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink-2);
  padding:8px 17px; border-radius:999px; white-space:nowrap;
  position:relative; z-index:1; transition:color .24s ease;
}
.tab[aria-selected="true"]{color:var(--paper)}
.views .tab[aria-selected="true"]{color:var(--flare-ink)}
.tab:hover:not([aria-selected="true"]){color:var(--ink)}

.status{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:10.5px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.dot{width:7px; height:7px; border-radius:50%; background:var(--flare); flex:none;
  box-shadow:0 0 0 0 var(--flare-wash); animation:ping 2.6s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--flare-wash)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.status b{color:var(--ink-2); font-weight:500}
.refresh{border:1px solid var(--rule); border-radius:999px; padding:6px 13px; font-family:var(--mono);
  font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); transition:.18s}
.refresh:hover{border-color:var(--ink); color:var(--ink)}
.refresh[data-busy="1"]{opacity:.5; pointer-events:none}

@media (max-width:700px){
  .mast-in{min-height:0; padding-top:11px; padding-bottom:10px; gap:9px 10px}
  .wordmark{padding:0}
  .wordmark b{font-size:19px}
  .wordmark .rule-dash{width:18px; height:3px; transform:translateY(-3px)}
  .wordmark i{display:none}
  .refresh{order:2; padding:5px 11px; font-size:9.5px}
  .tabs{order:3; padding:3px}
  .tab{padding:7px 15px; font-size:11.5px}
  .status{order:4; margin-left:auto; font-size:9.5px; gap:6px}
}
@media (max-width:400px){
  .status b{display:none}
  .status{font-size:9px}
}

/* ============================================================ show-more */
.more{display:block; width:100%; margin:22px 0 4px; padding:13px; border:1px solid var(--rule);
  border-radius:3px; background:var(--surface); font-family:var(--display); font-weight:700;
  font-stretch:88%; font-size:12px; letter-spacing:.09em; text-transform:uppercase; transition:.18s}
.more:hover{border-color:var(--ink); background:var(--sunk)}

/* ============================================================ shell */
.shell{
  max-width:var(--max); margin:0 auto; padding:26px var(--gutter) 72px;
  display:grid; gap:34px; align-items:start;
  grid-template-columns:var(--rail-l) minmax(0,1fr) var(--rail-r);
  grid-template-areas:"topics main lists";
}
.col-topics{grid-area:topics; position:sticky; top:calc(env(safe-area-inset-top,0px) + 88px)}
.col-main{grid-area:main; min-width:0}
.col-lists{grid-area:lists}

@media (max-width:1180px){
  .shell{grid-template-columns:minmax(0,1fr) var(--rail-r); grid-template-areas:"topics topics" "main lists"; gap:28px}
  .col-topics{position:static}
}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr); grid-template-areas:"main" "topics" "lists"; gap:34px}
}

/* ============================================================ section heads */
.mod,.col-topics,.col-main{scroll-margin-top:104px}
.head{display:flex; align-items:baseline; gap:10px; padding-bottom:9px; border-bottom:2px solid var(--ink); margin-bottom:16px}
.head h2{
  margin:0; font-family:var(--display); font-weight:800; font-stretch:80%;
  font-size:14px; letter-spacing:.11em; text-transform:uppercase; line-height:1;
}
.head span{margin-left:auto; font-family:var(--mono); font-size:10px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}

/* ============================================================ topic cycler */
.cycler{background:var(--surface); border:1px solid var(--rule); border-radius:3px; overflow:hidden; box-shadow:var(--shadow)}
.bar{height:3px; background:var(--rule-soft); position:relative; overflow:hidden}
.bar i{position:absolute; inset:0 auto 0 0; width:100%; background:var(--flare);
  transform:scaleX(0); transform-origin:0 50%; will-change:transform}
.cycler-in{padding:16px 17px 14px; display:flex; flex-direction:column; min-height:224px}
.cyc-top{display:grid; grid-template-columns:72px minmax(0,1fr); gap:12px; align-items:start; margin-bottom:10px}
.cyc-shot{aspect-ratio:1/1; border-radius:3px; overflow:hidden; background:var(--sunk)}
.cyc-shot img{width:100%; height:100%; object-fit:cover}
.cyc-kicker{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--flare); margin-bottom:6px}
.cyc-h{
  margin:0; font-family:var(--display); font-weight:700; font-stretch:84%;
  font-size:19px; line-height:1.16; letter-spacing:-.014em; text-wrap:balance;
}
.cyc-p{margin:0; font-size:14.5px; line-height:1.52; color:var(--ink-2); font-weight:300}
.cyc-src{margin-top:10px; font-family:var(--mono); font-size:10px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--ink-3)}
.cyc-src u{text-decoration:none; border-bottom:1px solid var(--rule); padding-bottom:1px}
.cyc-fade{animation:fadeup .38s ease both}
@keyframes fadeup{from{opacity:0; transform:translateY(7px)}to{opacity:1; transform:none}}

.cyc-nav{display:flex; align-items:center; gap:7px; margin-top:auto; padding-top:15px; border-top:1px solid var(--rule-soft)}
.arrow{width:29px; height:29px; border:1px solid var(--rule); border-radius:50%; display:grid; place-items:center;
  color:var(--ink-2); transition:.16s; flex:none}
.arrow:hover{border-color:var(--ink); color:var(--ink); background:var(--sunk)}
.arrow svg{width:13px; height:13px}
.pips{display:flex; gap:4px; margin:0 auto}
.pip{width:5px; height:5px; border-radius:50%; background:var(--rule); padding:0; transition:.2s}
.pip[aria-current="true"]{background:var(--flare); transform:scale(1.35)}
.count{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:var(--ink-3); font-variant-numeric:tabular-nums}

/* ============================================================ views */
.views .tab{font-size:12.5px}
.shell[data-view="campaigns"] .col-topics,
.shell[data-view="campaigns"] .col-lists,
.shell[data-view="awarded"] .col-topics,
.shell[data-view="awarded"] .col-lists{display:none}
.shell[data-view="campaigns"],
.shell[data-view="awarded"]{grid-template-columns:minmax(0,1fr); grid-template-areas:"main"}

.swap{animation:swapin .34s cubic-bezier(.2,.8,.3,1) both}
@keyframes swapin{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}

/* ============================================================ cards */
.cards{display:grid; gap:26px 22px; grid-template-columns:repeat(auto-fill,minmax(262px,1fr))}
.card{display:flex; flex-direction:column; gap:10px; min-width:0}
.card figure{margin:0; aspect-ratio:16/10; border-radius:3px; overflow:hidden; background:var(--sunk); position:relative}
.card figure img{width:100%; height:100%; object-fit:cover; transition:transform .55s cubic-bezier(.2,.7,.3,1)}
.card:hover figure img{transform:scale(1.04)}
.card h3{
  margin:0; font-family:var(--display); font-weight:700; font-stretch:86%;
  font-size:18px; line-height:1.16; letter-spacing:-.014em; text-wrap:balance;
}
.card:hover h3{text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:3px; text-decoration-color:var(--flare)}
.card .who{font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3)}
.card .blurb{margin:0; font-size:14px; line-height:1.46; color:var(--ink-2); font-weight:300}
.card .tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:auto; padding-top:4px}
.tag{font-family:var(--mono); font-size:9px; letter-spacing:.05em; text-transform:uppercase;
  border:1px solid var(--rule); border-radius:2px; padding:2px 5px; color:var(--ink-3);
  white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis}
.card .tags{min-width:0}
.tag.top{border-color:var(--flare); color:var(--flare)}
.tag.plain{border-style:dashed}

/* the award ribbon sits on the picture so a scan reads "why is this here" first */
.ribbon{position:absolute; left:8px; top:8px; display:flex; flex-direction:column; gap:4px; align-items:flex-start}
.ribbon span{font-family:var(--display); font-weight:700; font-stretch:88%; font-size:9.5px;
  letter-spacing:.07em; text-transform:uppercase; padding:3px 7px; border-radius:2px;
  background:rgba(12,10,8,.78); color:#fff; backdrop-filter:blur(3px)}
.ribbon span.top{background:var(--flare); color:var(--flare-ink)}
.card .count{font-family:var(--mono); font-size:9.5px; color:var(--ink-3)}

@media (max-width:620px){
  .cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:20px 14px}
  .card h3{font-size:15px}
  .card .blurb{display:none}
  /* Long award labels must fold inside their card, never across the gutter. */
  .tag{white-space:normal; overflow-wrap:anywhere; line-height:1.3}
}

/* ============================================================ filters */
.filters{margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--rule)}
.fgroup{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; margin-top:11px}
.fgroup:first-child{margin-top:0}
.flabel{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); width:58px; flex:none}
@media (max-width:520px){ .flabel{width:100%} }
.chip{
  font-family:var(--display); font-weight:600; font-stretch:90%; font-size:11.5px;
  letter-spacing:.055em; text-transform:uppercase; color:var(--ink-2);
  border:1px solid var(--rule); border-radius:999px; padding:5px 11px; transition:.16s;
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.chip:hover{border-color:var(--ink); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.chip i{font-style:normal; font-family:var(--mono); font-size:9.5px; opacity:.6; font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] i{opacity:.75}
.chip.key[aria-pressed="true"]{background:var(--flare); border-color:var(--flare); color:var(--flare-ink)}
.unsorted{display:block; width:100%; margin:20px 0 4px; padding:11px; border:1px dashed var(--rule);
  border-radius:3px; font-family:var(--mono); font-size:10.5px; letter-spacing:.05em;
  text-transform:uppercase; color:var(--ink-3); transition:.16s; background:none}
.unsorted:hover{border-color:var(--ink-3); color:var(--ink-2)}
.empty{padding:26px 0; color:var(--ink-2); font-size:15px}

/* ============================================================ lead story */
.lead{display:block; margin-bottom:26px}
.lead figure{margin:0 0 15px; position:relative; border-radius:3px; overflow:hidden; background:var(--sunk); aspect-ratio:16/9}
.lead figure img{width:100%; height:100%; object-fit:cover; transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.lead:hover figure img{transform:scale(1.025)}
.lead h1{
  margin:0 0 11px; font-family:var(--display); font-weight:800; font-stretch:78%;
  font-size:clamp(30px,4.1vw,46px); line-height:1.02; letter-spacing:-.028em; text-wrap:balance;
}
.lead:hover h1{text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:4px; text-decoration-color:var(--flare)}
.lead p{margin:0 0 12px; font-size:18px; line-height:1.48; color:var(--ink-2); font-weight:300; max-width:60ch}

.flag{display:inline-flex; align-items:center; gap:7px; margin-bottom:11px;
  font-family:var(--mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase}
.flag em{font-style:normal; background:var(--flare); color:var(--flare-ink); padding:3px 7px; border-radius:2px; font-weight:500}
.flag s{text-decoration:none; color:var(--ink-3)}

.byline{display:flex; align-items:center; gap:9px; font-family:var(--mono); font-size:10.5px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); flex-wrap:wrap}
.byline b{color:var(--ink); font-weight:500}
.byline .sep{width:3px; height:3px; border-radius:50%; background:var(--rule); flex:none}

/* ============================================================ story feed */
.daymark{display:flex; align-items:center; gap:12px; margin:26px 0 14px}
.daymark span{font-family:var(--mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.daymark i{flex:1; height:1px; background:var(--rule)}

.story{display:grid; grid-template-columns:112px minmax(0,1fr); gap:16px; padding:15px 0;
  border-top:1px solid var(--rule-soft); align-items:start}
.daymark + .story{border-top:0}
.story .shot{aspect-ratio:4/3; border-radius:2px; overflow:hidden; background:var(--sunk)}
.story .shot img{width:100%; height:100%; object-fit:cover; transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.story:hover .shot img{transform:scale(1.05)}
.story h3{
  margin:0 0 6px; font-family:var(--display); font-weight:600; font-stretch:88%;
  font-size:17.5px; line-height:1.21; letter-spacing:-.011em; text-wrap:balance;
}
.story:hover h3{text-decoration:underline; text-decoration-thickness:1.5px; text-underline-offset:3px; text-decoration-color:var(--flare)}
.story p{margin:0 0 7px; font-size:14px; line-height:1.48; color:var(--ink-2); font-weight:300;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-clamp:2; overflow:hidden}
@media (max-width:520px){ .story{grid-template-columns:86px minmax(0,1fr); gap:13px} .story h3{font-size:16px} .story p{display:none} }

/* fallback tile when a publisher gives us no picture */
.tile{width:100%; height:100%; display:grid; place-items:center; position:relative; overflow:hidden}
.tile::after{content:""; position:absolute; inset:0;
  background:linear-gradient(120deg,transparent 42%,rgba(255,255,255,.14) 50%,transparent 58%)}
.tile b{font-family:var(--display); font-weight:800; font-stretch:72%; font-size:clamp(15px,26%,40px);
  letter-spacing:.02em; color:rgba(255,255,255,.94); text-transform:uppercase; z-index:1; text-align:center; padding:0 6px; line-height:1}

.meter{display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-size:9px;
  letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);
  border:1px solid var(--rule); border-radius:2px; padding:1px 5px}
.meter b{font-weight:400; color:var(--ink-3)}

/* ============================================================ rail modules */
.mod{margin-bottom:34px}
.rank{display:grid; grid-template-columns:26px minmax(0,1fr); gap:11px; padding:11px 0;
  border-top:1px solid var(--rule-soft); align-items:baseline}
.rank:first-of-type{border-top:0; padding-top:2px}
.rank .n{font-family:var(--mono); font-size:12px; color:var(--flare); font-variant-numeric:tabular-nums; letter-spacing:-.03em}
.rank h4{margin:0 0 3px; font-family:var(--display); font-weight:600; font-stretch:90%;
  font-size:14.5px; line-height:1.24; letter-spacing:-.008em}
.rank a:hover h4{text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--flare)}
.rank .meta{font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3)}
.rank .note{margin:5px 0 0; font-size:13px; line-height:1.45; color:var(--ink-2); font-weight:300}

.award{display:inline-block; font-family:var(--mono); font-size:9px; letter-spacing:.07em;
  text-transform:uppercase; color:var(--ink-2); border:1px solid var(--rule); border-radius:2px;
  padding:2px 5px; margin-bottom:5px}
.award[data-gp="1"]{border-color:var(--flare); color:var(--flare)}

.nordic-item{display:grid; grid-template-columns:24px minmax(0,1fr); gap:10px; padding:10px 0; border-top:1px solid var(--rule-soft)}
.nordic-item:first-of-type{border-top:0}
.mk{font-family:var(--mono); font-size:9.5px; font-weight:500; letter-spacing:.04em; color:var(--ink-2);
  border:1px solid var(--rule); border-radius:2px; padding:2px 0; text-align:center; height:fit-content}
.mk[data-m="FI"]{border-color:#0B5FC4; color:#0B5FC4}
.mk[data-m="SE"]{border-color:#B08300; color:#8A6800}
:root[data-theme="dark"] .mk[data-m="FI"], :root:not([data-theme="light"]) .mk[data-m="FI"]{color:#6FA8FF; border-color:#3D6FB5}
:root[data-theme="dark"] .mk[data-m="SE"], :root:not([data-theme="light"]) .mk[data-m="SE"]{color:#E8C24A; border-color:#8A7226}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]) .mk[data-m="FI"]{color:#0B5FC4; border-color:#0B5FC4}
  :root:not([data-theme="dark"]) .mk[data-m="SE"]{color:#8A6800; border-color:#B08300} }
.nordic-item h4{margin:0 0 3px; font-family:var(--display); font-weight:600; font-stretch:90%; font-size:14px; line-height:1.26}
.nordic-item a:hover h4{text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--flare)}

.subhead{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); margin:18px 0 8px; padding-top:13px; border-top:1px solid var(--rule)}
.credit{margin:11px 0 0; font-size:12px; line-height:1.5; color:var(--ink-3); font-family:var(--display); font-weight:400}
.credit a{border-bottom:1px solid var(--rule)}
.credit a:hover{color:var(--ink); border-color:var(--flare)}

/* ============================================================ misc */

  background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px;
  font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;

<script>
(function () {
  'use strict';

  var $ = function (s) { return document.querySelector(s); };
  var state = { region: 'global', live: null, cur: null, topic: 0, stamp: '', raf: null, paused: false, expanded: false, liveHost: false,
    kind: '', sector: '', channel: '', showUnsorted: false,
    view: 'news', awarded: null, show: '' };
  var CYCLE_MS = 8000;

  /* ------------------------------------------------------------ helpers */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function ago(ts) {
    if (!ts) return '';
    var m = Math.round((Date.now() - ts) / 60000);
    if (m < 2) return 'just now';
    if (m < 60) return m + ' min ago';
    var h = Math.round(m / 60);
    if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
    var d = Math.round(h / 24);
    if (d < 8) return d + (d === 1 ? ' day ago' : ' days ago');
    return new Date(ts).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  }

  var BANDS = ['Today', 'Yesterday', 'Earlier this week', 'Earlier this month', 'Undated'];

  function bandIndex(ts) {
    if (!ts) return 4;
    var a = new Date(), b = new Date(ts);
    var d0 = new Date(a.getFullYear(), a.getMonth(), a.getDate());
    var d1 = new Date(b.getFullYear(), b.getMonth(), b.getDate());
    var days = Math.round((d0 - d1) / 864e5);
    if (days <= 0) return 0;
    if (days === 1) return 1;
    if (days <= 6) return 2;
    return 3;
  }

  // Deterministic colour tile for stories a publisher gives us no picture for.
  function tile(label) {
    var s = String(label || '?'), h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    var a = h, b = (h + 34) % 360;
    var words = s.split(/\s+/).filter(Boolean);
    var mark = words.length > 1 ? words.slice(0, 2).map(function (w) { return w[0]; }).join('') : s.slice(0, 3);
    return '<div class="tile" style="background:linear-gradient(140deg,hsl(' + a + ' 58% 42%),hsl(' + b + ' 64% 30%))">' +
           '<b>' + esc(mark) + '</b></div>';
  }

  function picture(item) { return item.thumb || item.src || ''; }

  function shot(item, cls) {
    var pic = picture(item);
    if (pic) {
      return '<div class="' + cls + '"><img src="' + esc(pic) + '" alt="" loading="lazy" decoding="async" ' +
             'onerror="this.parentNode.innerHTML=this.getAttribute(\'data-fb\')" ' +
             'data-fb="' + esc(tile(item.source)) + '"></div>';
    }
    return '<div class="' + cls + '">' + tile(item.source) + '</div>';
  }

  function byline(item) {
    var t = ago(item.ts);
    // Paywalled stories never reach the page; metered ones do, so say so
    // rather than letting the reader find out by clicking.
    var chip = item.access === 'metered'
      ? '<span class="sep"></span><span class="meter">Metered</span>' : '';
    var also = (item.alsoIn && item.alsoIn.length)
      ? '<span class="sep"></span><span>also in ' + esc(item.alsoIn.join(', ')) + '</span>' : '';
    return '<div class="byline"><b>' + esc(item.source) + '</b>' +
           (t ? '<span class="sep"></span><span>' + esc(t) + '</span>' : '') +
           chip + also + '</div>';
  }

  /* -------------------------------------------------------- tab glider */
  function moveGlider(tabs) {
    if (!tabs) return;
    var g = tabs.querySelector('.glider');
    var on = tabs.querySelector('[aria-selected="true"]');
    if (!g || !on) return;
    g.style.width = on.offsetWidth + 'px';
    g.style.transform = 'translateX(' + on.offsetLeft + 'px)';
    g.dataset.ready = '1';
  }

  function moveGliders() {
    moveGlider(document.querySelector('.views'));
    moveGlider($('#regions'));
  }

  // Replays the enter animation on whichever panel is now on screen.
  function swap(el) {
    if (!el) return;
    el.classList.remove('swap');
    void el.offsetWidth;          // restart the animation
    el.classList.add('swap');
  }

  /* ------------------------------------------------------------- cards */
  var TOP_AWARDS = /grand prix|black pencil|grand clio|titanium|grand prix for good/i;

  // `eager` matters for the cards above the fold: these views render into a
  // container that was hidden a moment earlier, and a lazy image parsed while
  // its container is hidden may never begin loading at all. Cards further down
  // stay lazy so a phone does not pull the whole gallery at once.
  function cardShot(pic, fallbackLabel, ribbon, idx) {
    var load = (idx == null || idx < 6) ? 'eager' : 'lazy';
    var inner = pic
      ? '<img src="' + esc(pic) + '" alt="" loading="' + load + '" decoding="async" ' +
        'onerror="this.parentNode.innerHTML=this.getAttribute(\'data-fb\')" ' +
        'data-fb="' + esc(tile(fallbackLabel) + (ribbon || '')) + '">'
      : tile(fallbackLabel);
    return '<figure>' + inner + (ribbon || '') + '</figure>';
  }

  // Campaign work, shown as something you scan rather than read.
  function renderCampaigns() {
    var list = ((state.live && state.live[state.region]) || [])
      .filter(function (a) { return a.kind === 'work'; });
    if (state.sector) list = list.filter(function (a) { return a.sector === state.sector; });
    if (state.channel) list = list.filter(function (a) { return a.channel === state.channel; });

    // A card feed is carried by its pictures, so lead with the work that has one.
    list = list.slice().sort(function (x, y) {
      return (picture(y) ? 1 : 0) - (picture(x) ? 1 : 0);
    });

    var host = $('#cards');
    if (!list.length) {
      host.innerHTML = '<p class="empty">No campaign work matches that in this pull. ' +
        'Try clearing the filters, or look under News.</p>';
      return;
    }

    host.innerHTML = '<div class="cards">' + list.map(function (a, idx) {
      var tags = [];
      if (a.sector) tags.push('<span class="tag">' + esc(a.sector) + '</span>');
      if (a.channel) tags.push('<span class="tag">' + esc(a.channel) + '</span>');
      if (a.access === 'metered') tags.push('<span class="tag plain">Metered</span>');
      return '<a class="card" href="' + esc(a.url) + '" target="_blank" rel="noopener">' +
        cardShot(picture(a), a.source, '', idx) +
        '<h3>' + esc(a.title) + '</h3>' +
        (a.summary ? '<p class="blurb">' + esc(a.summary) + '</p>' : '') +
        '<div class="who">' + esc(a.source) + (a.ts ? ' \u00b7 ' + esc(ago(a.ts)) : '') + '</div>' +
        (tags.length ? '<div class="tags">' + tags.join('') + '</div>' : '') +
        '</a>';
    }).join('') + '</div>';

    $('#feed-title').textContent = (state.region === 'europe' ? 'European campaign work' : 'Campaign work') +
      (state.sector ? ' \u00b7 ' + state.sector : '') + (state.channel ? ' \u00b7 ' + state.channel : '');
    $('#feed-note').textContent = list.length + ' campaigns';
  }

  // Award-winning cases, tagged with where they won and why.
  function renderAwarded() {
    var cases = (state.awarded && state.awarded.cases) || [];
    // Global means everything; Europe narrows to work made in Europe.
    if (state.region === 'europe') {
      cases = cases.filter(function (c) { return c.region === 'europe'; });
    }
    if (state.show) {
      cases = cases.filter(function (c) {
        return c.awards.some(function (a) { return a.show === state.show; });
      });
    }
    // Most decorated first: more shows beats more statues beats a bigger statue.
    cases = cases.slice().sort(function (x, y) {
      var sx = new Set(x.awards.map(function (a) { return a.show; })).size;
      var sy = new Set(y.awards.map(function (a) { return a.show; })).size;
      if (sx !== sy) return sy - sx;
      if (x.awards.length !== y.awards.length) return y.awards.length - x.awards.length;
      var tx = x.awards.filter(function (a) { return TOP_AWARDS.test(a.level); }).length;
      var ty = y.awards.filter(function (a) { return TOP_AWARDS.test(a.level); }).length;
      return ty - tx;
    });

    var host = $('#cards');
    if (!cases.length) { host.innerHTML = '<p class="empty">No cases from that show yet.</p>'; return; }

    host.innerHTML = '<div class="cards">' + cases.map(function (c, idx) {
      var shows = [];
      c.awards.forEach(function (a) { if (shows.indexOf(a.show) < 0) shows.push(a.show); });
      var ribbon = '<div class="ribbon">' + shows.slice(0, 3).map(function (sh) {
        var top = c.awards.some(function (a) { return a.show === sh && TOP_AWARDS.test(a.level); });
        return '<span class="' + (top ? 'top' : '') + '">' + esc(sh) + '</span>';
      }).join('') + '</div>';

      var tags = c.awards.slice(0, 4).map(function (a) {
        var label = a.category ? a.level + ' \u2014 ' + a.category : a.level;
        return '<span class="tag' + (TOP_AWARDS.test(a.level) ? ' top' : '') + '" title="' +
          esc(a.show + ': ' + label) + '">' + esc(label) + '</span>';
      });
      if (c.awards.length > 4) tags.push('<span class="tag plain">+' + (c.awards.length - 4) + '</span>');

      return '<a class="card" href="' + esc(c.url) + '" target="_blank" rel="noopener">' +
        cardShot(c.thumb || '', c.brand, ribbon, idx) +
        '<h3>' + esc(c.campaign) + '</h3>' +
        '<div class="who">' + esc(c.brand) + ' \u00b7 ' + esc(c.agency) +
          (c.country ? ' \u00b7 ' + esc(c.country) : '') + '</div>' +
        (c.blurb ? '<p class="blurb">' + esc(c.blurb) + '</p>' : '') +
        '<div class="tags">' + tags.join('') + '</div>' +
        '</a>';
    }).join('') + '</div>';

    var where = state.region === 'europe' ? 'European' : '';
    $('#feed-title').textContent = (state.show ? state.show : (where ? where + ' awarded' : 'Most awarded')) +
      (state.show && where ? ' \u00b7 Europe' : '') + (state.show ? ' \u2014 winning cases' : ' cases');
    $('#feed-note').textContent = cases.length + ' cases';
  }

  // One entry point, so every path through the app agrees on what is on screen.
  function renderView() {
    var news = state.view === 'news';
    $('#shell').dataset.view = state.view;
    $('#feed').hidden = !news;
    $('#cards').hidden = news;
    ['news', 'campaigns', 'awarded'].forEach(function (v) {
      $('#view-' + v).setAttribute('aria-selected', String(v === state.view));
    });
    renderFilters();
    if (news) renderFeed();
    else if (state.view === 'campaigns') renderCampaigns();
    else renderAwarded();
    moveGliders();
  }

  /* ----------------------------------------------------------- filters */
  var KIND_LABEL = { work: 'Campaign work', industry: 'Industry', media: 'Media' };

  // A story passes if it matches every active filter.
  function passes(a) {
    if (state.kind && a.kind !== state.kind) return false;
    if (state.kind === 'work') {
      if (state.sector && a.sector !== state.sector) return false;
      if (state.channel && a.channel !== state.channel) return false;
    }
    return true;
  }

  // Excluded only because we could not classify it - never because it is
  // the wrong kind of story. Those are offered rather than dropped.
  function isUnsorted(a) {
    if (state.kind && !a.kind) return true;
    if (state.kind && a.kind === state.kind) {
      if (state.sector && !a.sector) return true;
      if (state.channel && !a.channel) return true;
    }
    return false;
  }

  function countBy(list, key, val) {
    return list.filter(function (a) { return a[key] === val; }).length;
  }

  function chip(label, active, key, val, count, isKey) {
    return '<button class="chip' + (isKey ? ' key' : '') + '" aria-pressed="' + (active ? 'true' : 'false') +
      '" data-key="' + key + '" data-val="' + esc(val) + '">' + esc(label) +
      (count != null ? '<i>' + count + '</i>' : '') + '</button>';
  }

  function renderFilters() {
    var host = $('#filters');

    // Awarded has its own axis: which show gave the award.
    if (state.view === 'awarded') {
      var cases = (state.awarded && state.awarded.cases) || [];
      if (!cases.length) { host.innerHTML = ''; return; }
      var countShow = function (sh) {
        return cases.filter(function (c) {
          return c.awards.some(function (a) { return a.show === sh; });
        }).length;
      };
      host.innerHTML = '<div class="fgroup"><span class="flabel">Show</span>' +
        chip('All shows', !state.show, 'show', '', cases.length) +
        (state.awarded.shows || []).filter(countShow).map(function (sh) {
          return chip(sh, state.show === sh, 'show', sh, countShow(sh), true);
        }).join('') + '</div>';
      wireChips(host);
      return;
    }

    var list = (state.live && state.live[state.region]) || [];
    if (!list.length) { host.innerHTML = ''; return; }

    // Campaigns is already only work, so the kind switch would be a no-op there.
    if (state.view === 'campaigns') {
      var work = list.filter(function (a) { return a.kind === 'work'; });
      var f2 = (state.live.facets) || { sectors: [], channels: [] };
      var h2 = '';
      var secs2 = f2.sectors.filter(function (x) { return countBy(work, 'sector', x); });
      if (secs2.length) {
        h2 += '<div class="fgroup"><span class="flabel">Industry</span>' +
          chip('All', !state.sector, 'sector', '', work.length) +
          secs2.map(function (x) { return chip(x, state.sector === x, 'sector', x, countBy(work, 'sector', x)); }).join('') +
          '</div>';
      }
      var ch2 = f2.channels.filter(function (x) { return countBy(work, 'channel', x); });
      if (ch2.length) {
        h2 += '<div class="fgroup"><span class="flabel">Media</span>' +
          chip('All', !state.channel, 'channel', '', null) +
          ch2.map(function (x) { return chip(x, state.channel === x, 'channel', x, countBy(work, 'channel', x)); }).join('') +
          '</div>';
      }
      host.innerHTML = h2;
      wireChips(host);
      return;
    }

    var html = '<div class="fgroup"><span class="flabel">Show</span>' +
      chip('Everything', !state.kind, 'kind', '', list.length) +
      ['work', 'industry', 'media'].map(function (k) {
        return chip(KIND_LABEL[k], state.kind === k, 'kind', k, countBy(list, 'kind', k), k === 'work');
      }).join('') + '</div>';

    // Sector and channel only describe campaign work, so only offer them there.
    if (state.kind === 'work') {
      var work = list.filter(function (a) { return a.kind === 'work'; });
      var facets = (state.live.facets) || { sectors: [], channels: [] };

      var secs = facets.sectors.filter(function (x) { return countBy(work, 'sector', x); });
      if (secs.length) {
        html += '<div class="fgroup"><span class="flabel">Industry</span>' +
          chip('All', !state.sector, 'sector', '', null) +
          secs.map(function (x) {
            return chip(x, state.sector === x, 'sector', x, countBy(work, 'sector', x));
          }).join('') + '</div>';
      }

      var chans = facets.channels.filter(function (x) { return countBy(work, 'channel', x); });
      if (chans.length) {
        html += '<div class="fgroup"><span class="flabel">Media</span>' +
          chip('All', !state.channel, 'channel', '', null) +
          chans.map(function (x) {
            return chip(x, state.channel === x, 'channel', x, countBy(work, 'channel', x));
          }).join('') + '</div>';
      }
    }

    host.innerHTML = html;
    wireChips(host);
  }

  function wireChips(host) {
    Array.prototype.forEach.call(host.querySelectorAll('.chip'), function (b) {
      b.addEventListener('click', function () {
        var k = b.dataset.key, v = b.dataset.val;
        state[k] = (state[k] === v) ? '' : v;
        if (k === 'kind' && state.kind !== 'work') { state.sector = ''; state.channel = ''; }
        state.showUnsorted = false;
        state.expanded = false;
        renderView();
      });
    });
  }

  /* -------------------------------------------------------------- feed */
  function renderFeed() {
    var full = (state.live && state.live[state.region]) || [];
    var host = $('#feed');
    if (!full.length) {
      host.innerHTML = '<p class="empty">No stories on the wire yet. Hit Refresh to pull the feeds.</p>';
      return;
    }

    var list = full.filter(passes);
    var unsorted = full.filter(function (a) { return !passes(a) && isUnsorted(a); });
    if (state.showUnsorted) list = list.concat(unsorted);

    if (!list.length) {
      host.innerHTML = '<p class="empty">Nothing matches that filter in this pull.' +
        (unsorted.length ? ' ' + unsorted.length + ' stories could not be classified.' : '') + '</p>' +
        (unsorted.length ? '<button class="unsorted" id="unsorted">Show ' + unsorted.length +
          ' unclassified ' + (unsorted.length === 1 ? 'story' : 'stories') + '</button>' : '');
      var ub0 = $('#unsorted');
      if (ub0) ub0.addEventListener('click', function () { state.showUnsorted = true; renderFeed(); });
      return;
    }

    // On a phone the rails sit below the feed, so don't bury them under 34 stories.
    var narrow = window.matchMedia('(max-width:860px)').matches;
    var cap = narrow && !state.expanded ? 12 : list.length;

    // The lead carries a full-width picture, so never lead with a story that
    // has none - promote the best-ranked one in the top few that does.
    var leadIdx = 0;
    for (var i = 0; i < Math.min(6, list.length); i++) {
      if (picture(list[i])) { leadIdx = i; break; }
    }
    var lead = list[leadIdx];
    var others = list.filter(function (_, i) { return i !== leadIdx; });
    var rest = others.slice(0, cap - 1);
    var hidden = others.length - rest.length;
    var html = '<a class="lead" href="' + esc(lead.url) + '" target="_blank" rel="noopener">' +
      (picture(lead)
        ? '<figure><img src="' + esc(picture(lead)) + '" alt="" decoding="async" ' +
          'onerror="this.parentNode.innerHTML=this.getAttribute(\'data-fb\')" ' +
          'data-fb="' + esc(tile(lead.source)) + '"></figure>'
        : '<figure>' + tile(lead.source) + '</figure>') +
      '<div class="flag"><em>Lead</em><s>' + esc(state.region === 'europe' ? 'Europe' : 'Global') + '</s></div>' +
      '<h1>' + esc(lead.title) + '</h1>' +
      (lead.summary ? '<p>' + esc(lead.summary) + '</p>' : '') +
      byline(lead) + '</a>';

    // Rank inside each day, but always run the days newest-first so the
    // datelines read as a timeline instead of following the score.
    var groups = BANDS.map(function () { return []; });
    rest.forEach(function (it) { groups[bandIndex(it.ts)].push(it); });

    groups.forEach(function (items, i) {
      if (!items.length) return;
      html += '<div class="daymark"><span>' + esc(BANDS[i]) + '</span><i></i>' +
              '<span>' + items.length + '</span></div>';
      items.forEach(function (it) {
        html += '<a class="story" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
          shot(it, 'shot') +
          '<div><h3>' + esc(it.title) + '</h3>' +
          (it.summary ? '<p>' + esc(it.summary) + '</p>' : '') +
          byline(it) + '</div></a>';
      });
    });

    if (hidden > 0) {
      html += '<button class="more" id="more">Show ' + hidden + ' more ' +
              (hidden === 1 ? 'story' : 'stories') + '</button>';
    }
    if (unsorted.length && !state.showUnsorted) {
      html += '<button class="unsorted" id="unsorted">+ ' + unsorted.length +
        ' more we could not classify \u2014 show ' + (unsorted.length === 1 ? 'it' : 'them') + '</button>';
    }

    host.innerHTML = html;
    if (hidden > 0) {
      $('#more').addEventListener('click', function () { state.expanded = true; renderFeed(); });
    }
    var ub = $('#unsorted');
    if (ub) ub.addEventListener('click', function () { state.showUnsorted = true; renderFeed(); });
    var scope = (state.region === 'europe' ? 'Europe' : 'Global');
    var bits = [];
    if (state.kind) bits.push(KIND_LABEL[state.kind]);
    if (state.sector) bits.push(state.sector);
    if (state.channel) bits.push(state.channel);
    $('#feed-title').textContent = bits.length ? scope + ' — ' + bits.join(' · ') : scope + ' — This Week';
    $('#feed-note').textContent = list.length + ' of ' + full.length + ' stories';
    $('#feed').setAttribute('aria-labelledby', 'tab-' + state.region);
  }

  /* ------------------------------------------------------------- rails */
  function renderRails() {
    var c = state.cur;
    if (!c) return;

    $('#m-12').innerHTML = c.campaigns12m.map(function (x) {
      return '<a class="rank" href="' + esc(x.url) + '" target="_blank" rel="noopener">' +
        '<span class="n">' + String(x.rank).padStart(2, '0') + '</span><div>' +
        '<h4>' + esc(x.campaign) + '</h4>' +
        '<div class="meta">' + esc(x.brand) + (x.agency && x.agency !== '—' ? ' · ' + esc(x.agency) : '') + '</div>' +
        '<p class="note">' + esc(x.note) + '</p></div></a>';
    }).join('');

    $('#m-cannes').innerHTML = c.cannes2026.slice(0, 10).map(function (x) {
      var gp = /Grand Prix/i.test(x.award) ? '1' : '0';
      return '<a class="rank" href="' + esc(x.url) + '" target="_blank" rel="noopener">' +
        '<span class="n">' + String(x.rank).padStart(2, '0') + '</span><div>' +
        '<span class="award" data-gp="' + gp + '">' + esc(x.award) + '</span>' +
        '<h4>' + esc(x.campaign) + '</h4>' +
        '<div class="meta">' + esc(x.brand) + ' · ' + esc(x.agency) + '</div></div></a>';
    }).join('');

    var live = (state.live && state.live.nordic) || [];
    $('#m-nordic-live').innerHTML = live.length
      ? live.slice(0, 8).map(function (x) {
          return '<a class="nordic-item" href="' + esc(x.url) + '" target="_blank" rel="noopener">' +
            '<span class="mk" data-m="' + esc(x.market || '') + '">' + esc(x.market || '··') + '</span><div>' +
            '<h4>' + esc(x.title) + '</h4>' +
            '<div class="meta" style="font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)">' +
            esc(x.source) + (x.ts ? ' · ' + esc(ago(x.ts)) : '') + '</div></div></a>';
        }).join('')
      : '<p style="color:var(--ink-3);font-size:13px">Nothing new off the Nordic wire right now.</p>';

    $('#m-nordic-seed').innerHTML = c.nordicSeed.map(function (x) {
      return '<a class="nordic-item" href="' + esc(x.url) + '" target="_blank" rel="noopener">' +
        '<span class="mk" data-m="' + esc(x.market) + '">' + esc(x.market) + '</span><div>' +
        '<h4>' + esc(x.campaign) + '</h4>' +
        '<div class="meta" style="font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)">' +
        esc(x.brand) + (x.agency && x.agency !== '—' ? ' · ' + esc(x.agency) : '') + '</div></div></a>';
    }).join('');
  }

  /* ----------------------------------------------------- topic cycler */
  function paintTopic() {
    var t = state.cur.topics[state.topic];
    var pic = t.thumb || '';
    $('#cyc-body').innerHTML =
      '<div class="cyc-fade">' +
      '<div class="cyc-top">' +
        '<div class="cyc-shot">' + (pic
          ? '<img src="' + esc(pic) + '" alt="" decoding="async" ' +
            'onerror="this.parentNode.innerHTML=this.getAttribute(\'data-fb\')" ' +
            'data-fb="' + esc(tile(t.kicker)) + '">'
          : tile(t.kicker)) + '</div>' +
        '<div><div class="cyc-kicker">' + esc(t.kicker) + '</div>' +
        '<h3 class="cyc-h">' + esc(t.headline) + '</h3></div>' +
      '</div>' +
      '<p class="cyc-p">' + esc(t.ingress) + '</p>' +
      '<div class="cyc-src">Read it at <u>' + esc(t.source) + '</u> &rarr;</div>' +
      '</div>';
    $('#cyc-idx').textContent = String(state.topic + 1).padStart(2, '0') + '/' + String(state.cur.topics.length).padStart(2, '0');
    Array.prototype.forEach.call($('#pips').children, function (p, i) {
      p.setAttribute('aria-current', i === state.topic ? 'true' : 'false');
    });
    $('#cycler').dataset.href = t.url;
  }

  function goTopic(i) {
    var n = state.cur.topics.length;
    state.topic = ((i % n) + n) % n;
    paintTopic();
    restartCycle();
  }

  function restartCycle() {
    if (state.raf) cancelAnimationFrame(state.raf);
    var bar = $('#bar');
    var reduced = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    if (reduced) { bar.style.transform = 'scaleX(0)'; return; }
    var start = performance.now();
    (function step(now) {
      if (state.paused) { start += 16; state.raf = requestAnimationFrame(step); return; }
      var p = Math.min(1, (now - start) / CYCLE_MS);
      bar.style.transform = 'scaleX(' + p + ')';
      if (p >= 1) { goTopic(state.topic + 1); return; }
      state.raf = requestAnimationFrame(step);
    })(start);
  }

  function wireCycler() {
    var pips = $('#pips');
    pips.innerHTML = state.cur.topics.map(function (t, i) {
      return '<button class="pip" role="tab" aria-current="false" aria-label="Topic ' + (i + 1) + ': ' + esc(t.headline) + '"></button>';
    }).join('');
    Array.prototype.forEach.call(pips.children, function (p, i) {
      p.addEventListener('click', function () { goTopic(i); });
    });
    $('#prev').addEventListener('click', function () { goTopic(state.topic - 1); });
    $('#next').addEventListener('click', function () { goTopic(state.topic + 1); });

    var box = $('#cycler');
    ['mouseenter', 'focusin'].forEach(function (e) { box.addEventListener(e, function () { state.paused = true; }); });
    ['mouseleave', 'focusout'].forEach(function (e) { box.addEventListener(e, function () { state.paused = false; }); });
    box.addEventListener('click', function (ev) {
      if (ev.target.closest('button')) return;
      if (box.dataset.href) window.open(box.dataset.href, '_blank', 'noopener');
    });
    box.style.cursor = 'pointer';
    document.addEventListener('visibilitychange', function () { state.paused = document.hidden; });

    $('#cyc-count').textContent = state.cur.topics.length + ' topics';
    goTopic(0);
  }

  /* -------------------------------------------------------------- data */
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.dataset.show = '1';
    clearTimeout(t._t);
    t._t = setTimeout(function () { t.dataset.show = '0'; }, 3200);
  }

  function setStatus() {
    var d = state.live;
    if (!d) { $('#status').textContent = 'Offline'; return; }
    var n = (d.sources || []).length;
    var when = ago(Date.parse(d.generatedAt));
    var refreshed = state.liveHost || d.mode === 'hosted';
    $('#status').innerHTML = (refreshed ? 'Wire updated ' : 'Snapshot taken ') +
      '<b>' + esc(when) + '</b> \u00b7 ' + n + ' sources';
  }

  function renderFooter() {
    var d = state.live, c = state.cur;
    var srcs = (d && d.sources) || [];
    $('#foot').innerHTML =
      '<p style="max-width:76ch;margin:0 0 10px"><strong>Above the Line</strong> ' +
      ((state.liveHost || (d && d.mode === 'hosted'))
        ? 'pulls the advertising trade press every few minutes and ranks it by '
        : 'is showing a saved pull of the advertising trade press, ranked by ') +
      'recency, masthead and how squarely the story is about the work. Every headline links straight to the publisher — nothing is rewritten here.</p>' +
      '<p style="max-width:76ch;margin:0 0 10px">Articles the publisher marks as subscriber-only are dropped before they reach this page, ' +
      'checked per article rather than per masthead — so a paywalled title\'s open journalism still gets through. Where the same story ran in ' +
      'several outlets, the version you can actually read wins. Titles marked <span class="meter">Metered</span> allow a few free reads a month.</p>' +
      '<p style="max-width:76ch;margin:0 0 10px">On the wire right now: ' + srcs.map(esc).join(' · ') + '.</p>' +
      '<p style="margin:0">Cannes Lions case films are indexed by <a href="https://www.lovetheworkmore.com" target="_blank" rel="noopener">lovetheworkmore.com</a>. ' +
      'Rankings in the right-hand rails were compiled ' + esc(c ? c.generated : '') + ' and are reviewed by hand.</p>';
  }

  // Some static hosts refuse a query string on a published file, so retry bare.
  async function getJSON(path) {
    var tries = [path + '?t=' + Date.now(), path];
    for (var i = 0; i < tries.length; i++) {
      try {
        var r = await fetch(tries[i], { cache: 'no-store' });
        if (r.ok) return await r.json();
      } catch (e) { /* try the next form */ }
    }
    throw new Error('could not load ' + path);
  }

  async function loadLive(announce) {
    try {
      var d = await getJSON('data/live.json');
      var changed = state.stamp && d.generatedAt !== state.stamp;
      state.live = d;
      state.stamp = d.generatedAt;
      renderView(); renderRails(); setStatus(); renderFooter();
      if (changed && announce) toast('Wire updated');
      return true;
    } catch (e) {
      setStatus();
      return false;
    }
  }

  // The page runs either behind server.js (feeds refresh on a timer) or as a
  // published snapshot. Say which, rather than implying the wire is live.
  async function probeHost() {
    try {
      var r = await fetch('api/status', { cache: 'no-store' });
      state.liveHost = r.ok;
    } catch (e) { state.liveHost = false; }
    document.body.dataset.host = state.liveHost ? 'live' : 'static';
  }

  async function boot() {
    await probeHost();
    try {
      state.cur = await getJSON('data/curated.json');
    } catch (e) {
      $('#cyc-body').innerHTML = '<p class="cyc-p">Could not load the archive.</p>';
      return;
    }
    try { state.awarded = await getJSON('data/awarded.json'); }
    catch (e) { state.awarded = null; }
    wireCycler();
    renderRails();
    await loadLive(false);

    var polls = state.liveHost || (state.live && state.live.mode === 'hosted');
    if (polls) setInterval(function () { loadLive(true); }, state.liveHost ? 90000 : 300000);
    setInterval(setStatus, 60000);
  }

  // Wired before any data arrives, so a click in the first moments is never lost.
  function switchView(v) {
    if (state.view === v) return;
    state.view = v;
    state.showUnsorted = false;
    state.expanded = false;
    // Sector and channel mean the same thing in both feed views, so they carry
    // across; kind and show do not apply outside their own view.
    if (v !== 'awarded') state.show = '';
    if (v === 'campaigns') state.kind = '';
    renderView();
    swap(state.view === 'news' ? $('#feed') : $('#cards'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function wireControls() {
    ['news', 'campaigns', 'awarded'].forEach(function (v) {
      $('#view-' + v).addEventListener('click', function () { switchView(v); });
    });
    $('#tab-global').addEventListener('click', function () { switchTab('global'); });
    $('#tab-europe').addEventListener('click', function () { switchTab('europe'); });
    $('#refresh').addEventListener('click', async function () {
      var b = $('#refresh');
      b.dataset.busy = '1'; b.textContent = 'Pulling\u2026';
      var pulled = false;
      if (state.liveHost) {
        try { var r = await fetch('api/refresh', { method: 'POST' }); pulled = r.ok; } catch (e) { pulled = false; }
      }
      await loadLive(pulled);
      b.dataset.busy = '0'; b.textContent = 'Refresh';
      if (!state.liveHost && !(state.live && state.live.mode === 'hosted')) {
        toast('Static snapshot \u2014 run the refresher for live feeds');
      }
    });
  }

  function switchTab(region) {
    if (!state.live) { state.region = region; }
    if (state.region === region && state.live) return;
    state.region = region;
    state.expanded = false;
    ['global', 'europe'].forEach(function (r) {
      $('#tab-' + r).setAttribute('aria-selected', String(r === region));
    });
    state.showUnsorted = false;
    state.expanded = false;
    renderView();
    swap(state.view === 'news' ? $('#feed') : $('#cards'));
  }

  wireControls();

  // Re-render when the layout crosses the phone breakpoint so the cap matches the column count.
  var mq = window.matchMedia('(max-width:860px)');
  var onMQ = function () { if (state.live) renderView(); };
  window.addEventListener('resize', moveGliders);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveGliders);
  mq.addEventListener ? mq.addEventListener('change', onMQ) : mq.addListener(onMQ);

  document.addEventListener('keydown', function (e) {
    if (e.target.matches('input,textarea')) return;
    if (!state.cur) return;
    if (e.key === 'ArrowLeft' && e.altKey) goTopic(state.topic - 1);
    if (e.key === 'ArrowRight' && e.altKey) goTopic(state.topic + 1);
  });

  boot();
})();
</script>
