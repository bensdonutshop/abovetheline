name: Refresh and publish

on:
  schedule:
    # Every 15 minutes. GitHub queues scheduled runs, so treat this as "about
    # every 15-20 minutes" rather than exact.
    - cron: '*/15 * * * *'
  workflow_dispatch:        # lets you trigger a pull by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two refreshes deploy over each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull the feeds
        run: node refresh.js --hosted

      - name: Build the site
        run: node build.js --hosted

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
